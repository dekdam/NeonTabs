<!DOCTYPE html>
<html lang="th" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeonTabs - Universal Client-Side Counter App</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            pitch: '#000000',
            darksurface: '#121212',
          }
        }
      }
    }
  </script>
  
  <style>
    /* Custom Tabular Numbers & Monospace for exact counter alignment */
    .font-mono {
      font-variant-numeric: tabular-nums;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #000000;
    }
    ::-webkit-scrollbar-thumb {
      background: #333333;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #555555;
    }
  </style>
</head>
<body class="bg-pitch text-white min-h-screen selection:bg-cyan-500 selection:text-black">
  <!-- Root Container for Single Page Application -->
  <div id="app-root"></div>

  <!-- App Logic -->
  <script src="./app.js"></script>
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/vce701823e78c4301a35b7e07294d87301792088814092" integrity="sha512-UKNk8GbxkABxKcXYuLkO16EleLGUkcvJWtpSNmExE0Too3ZaFAxTscNWEc1OdAv5/BikHawapSCaiD2XCmp+Bw==" data-cf-beacon='{"version":"2024.11.0","token":"4554328fd52045b7a2cfc4d5f5e3e0d3","r":1,"spa":2}' crossorigin="anonymous"></script>
</body>
</html>
